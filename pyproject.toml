[project]
name = "ai-teacher"
version = "1.0.0"
description = "An AI educator that plans lessons, teaches through generated video, questions the student, and adapts."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    # matplotlib warns per glyph when an Indic font is missing; the renderer
    # already logs this once at startup.
    "ignore:.*Glyph.*missing from font.*:UserWarning",
    "ignore:.*Matplotlib currently does not support.*:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["frontend", ".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends()/File() in defaults is the documented pattern
    "SIM108",  # ternaries are not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"backend/media/slides.py" = ["E402"]   # matplotlib.use("Agg") must precede pyplot
